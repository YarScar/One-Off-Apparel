services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: lp-internal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lpapp
      POSTGRES_PASSWORD: lpapp
      POSTGRES_DB: lpinternal
    ports:
      - "5433:5432"
    volumes:
      - lp-postgres-data:/var/lib/postgresql/data
      - ./infra/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lpapp -d lpinternal"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lp-postgres-data:
